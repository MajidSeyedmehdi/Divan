{% extends 'main/base.html' %}
{% load static %}

{% block content %}
<div class="container-fluid">
    <div class="row">
    <!-- BEGIN BREADCRUMB -->
    <div class="col-md-12">
        <div class="breadcrumb-box shadow">
            <ul class="breadcrumb">
                <li><a href="http://localhost:8000/home/">صدابرداران فنی</a></li>
                <li class="active">مدیر صدابرداران فنی</li>
            </ul>
            </div>
        </div>
            <!-- END BREADCRUMB -->
        <div class="col-md-12">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">{{ title }}</h3>
                </div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <div class="card h-100 border-primary">
                                <div class="card-body text-center">
                                    <h5 class="card-title">مدیریت شیفت‌ها</h5>
                                    <a href="{% url 'sound_recorders:soundrecorders_manager:shift:shift' %}" class="btn btn-outline-primary">ورود به بخش شیفت</a>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card h-100 border-success">
                                <div class="card-body text-center">
                                    <h5 class="card-title">مدیریت برنامه‌های زنده</h5>
                                    <p class="text-muted">مشاهده برنامه‌ها و رکوردهای در انتظار پرداخت</p>
                                    <a href="{% url 'sound_recorders:soundrecorders_manager:live:summary' %}" class="btn btn-outline-success">ورود به مدیریت زنده‌ها</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
