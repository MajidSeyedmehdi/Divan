{% extends 'main/base.html' %}
{% load static %}
{% block content %}

<style>
    input[type="text"], select, textarea {
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 6px 10px;
        width: 200px;
        font-size: 14px;
        transition: border-color 0.3s, box-shadow 0.3s;
    }

    input[type="text"]:focus, select:focus, textarea:focus {
        border-color: #66afe9;
        outline: none;
        box-shadow: 0 0 5px rgba(102, 175, 233, 0.6);
    }

    label {
        margin-left: 8px;
        font-weight: bold;
        font-size: 14px;
        min-width: 80px;
    }

    li {
        margin-bottom: 12px;
    }

    button[type="submit"] {
        background-color: #007bff;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
    }

    button[type="submit"]:hover {
        background-color: #0056b3;
    }
    
    /* رنگ پس‌زمینه سطر اول (سرتیترها) */
    table thead th {
        background-color: #e6f2ff !important;   
        color: white;               /* رنگ نوشته‌ها */
    }
    
    /* رنگ پس‌زمینه ستون اول در تمام ردیف‌ها */
    table tbody td:first-child {
        background-color: #e6f2ff;  
        font-weight: bold;
}
    .table-wrapper {
        max-width: 800px;   /* یا هر عدد دلخواه مثل 600px */
        margin: 0 auto;     /* وسط‌چین کردن */
    }

    .table th:first-child,
    .table td:first-child {
        width: 25%;
        white-space: nowrap;
    }
    .table-rounded {
        border-radius: 12px;
        overflow: hidden;
    }
    .table th:nth-child(2),
    .table td:nth-child(2) {
        width: 75%;
    }

    .table td.editable {
        direction: ltr;
        text-align: left;
    }
</style>
 

            <!-- BEGIN PAGE CONTENT -->
            <div class="container-fluid">
               
                    <div class="row">                    
                        <!-- BEGIN BREADCRUMB -->
                        <div class="col-md-12">
                            <div class="breadcrumb-box shadow"> 
                                
                                <div class="breadcrumb-left">
                                    <i class="icon-calendar"></i>
                                </div><!-- /.breadcrumb-left -->
                            </div><!-- /.breadcrumb-box -->
                        </div><!-- /.col-md-12 -->
                        <!-- END BREADCRUMB -->                        
                        
                        <div class="col-lg-12">
                            <div class="portlet box shadow">
                                <div class="portlet-heading">
                                    <div class="portlet-title">
                                        <h3 class="title">                                        
                                            <i class="icon-frane"></i>
                                             تغییر رمز عبور
                                        </h3>
                                    </div><!-- /.portlet-title -->
                                    <div class="buttons-box">
                                        
                                        <div class="code-modal hide">

                                        </div>
                                        
                                        <a class="btn btn-sm btn-default btn-round btn-collapse" rel="tooltip" title="کوچک کردن" href="#">
                                            <i class="icon-arrow-up"></i>
                                        </a>
                                    </div><!-- /.buttons-box -->
                                </div><!-- /.portlet-heading -->
                                <div class="portlet-body">
                                    <div class="table-responsive">
                     <!-- نمایش  --> 
                                    <form method="post">
                                      {% csrf_token %}
                                      <div class="form-group">
                                        {{ form.username.label_tag }}
                                        {{form.username }}
                                      </div>
                                      <div class="form-group">
                                        {{ form.password.label_tag }}
                                        {{ form.password }}
                                      </div>
                                      <input type="hidden" name="action" value="save_password">
                                      <button type="submit">ذخیره رمز جدید</button>
                                    </form>
                                    
                                    {% if message %}
                                      <p style="color: green;">{{ message }}</p>
                                    {% endif %}
                                                <!-- نمایش پایان -->
    
                                    </div><!-- /.table-responsive -->
                                </div><!-- /.portlet-body -->
                            </div><!-- /.portlet -->
                        </div><!-- /.col-lg-12 -->
                  </div><!-- /.row -->
                </div><!-- /#inner-content -->
      
            <!-- END PAGE CONTENT -->
    
        <!-- END WRAPPER -->
 {% endblock %}       
    
    <!-----ارسال ورودی به جنگو--->
    {% block scripts %}
<script>
document.addEventListener("DOMContentLoaded", function() {
    const cells = document.querySelectorAll(".editable");
    cells.forEach(cell => {
        cell.addEventListener("input", function() {
            const key = cell.getAttribute("data-key");
            const hiddenInput = document.getElementById("input_" + key);
            if (hiddenInput) {
                hiddenInput.value = cell.innerText.trim();
            }
        });
    });
});
</script>

{% endblock %}
